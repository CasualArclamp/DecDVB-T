# made by CasualArclamp
[package]
name = "decdvbt-io"
description = "DecDVB-T I/O: IQ file replay/record and the HackRF, Airspy R2 / HydraSDR and ADALM-PLUTO front ends"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# Live HackRF One front end, in pure Rust over USB (nusb): no libhackrf, no
# libusb, no DLLs — the portable exe stays a single file. On Windows the HackRF
# must use the WinUSB driver (Zadig, or the in-box winusb.inf).
hackrf = ["dep:seify-hackrfone"]
# Live Airspy R2 front end, in pure Rust over nusb as well (no libairspy, no
# libusb, no DLLs). The radio must use the WinUSB driver on Windows.
airspy = ["dep:nusb", "dep:futures-lite"]
# Live ADALM-PLUTO / Pluto+ front end: its IIOD protocol in pure Rust over USB
# (nusb, WinUSB) or TCP. No libiio, no DLLs.
pluto = ["dep:nusb", "dep:futures-lite"]

[dependencies]
decdvbt-core = { path = "../decdvbt-core" }
num-complex.workspace = true
thiserror.workspace = true
tracing.workspace = true
seify-hackrfone = { version = "0.2.2", optional = true }
# The versions seify-hackrfone already uses, so the exe carries one copy.
nusb = { version = "0.1.14", optional = true }
futures-lite = { version = "2", optional = true }

[dev-dependencies]
rustfft.workspace = true
