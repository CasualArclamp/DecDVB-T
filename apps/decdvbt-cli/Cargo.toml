# made by CasualArclamp
[package]
name = "decdvbt-cli"
description = "DecDVB-T command line"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "decdvbt"
path = "src/main.rs"

[features]
default = ["hackrf", "airspy"]
hackrf = ["decdvbt-io/hackrf"]
airspy = ["decdvbt-io/airspy"]

[dependencies]
decdvbt-core = { path = "../../crates/decdvbt-core" }
decdvbt-io = { path = "../../crates/decdvbt-io" }
decdvbt-engine = { path = "../../crates/decdvbt-engine" }
decdvbt-mod = { path = "../../crates/decdvbt-mod" }
decdvbt-rx = { path = "../../crates/decdvbt-rx" }
decdvbt-ts = { path = "../../crates/decdvbt-ts" }
anyhow.workspace = true
clap = { version = "4.6", features = ["derive"] }
