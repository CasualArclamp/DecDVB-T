# made by CasualArclamp
[package]
name = "decdvbt-cli"
description = "DecDVB-T command line"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "decdvbt"
path = "src/main.rs"

[features]
# The Fobos, SDRplay and USRP (UHD, Windows) drivers load their maker's
# library at run time, so they build anywhere; the remote link is plain TCP.
default = ["hackrf", "airspy", "pluto", "rtlsdr", "fobos", "sdrplay", "uhd", "remote"]
hackrf = ["decdvbt-io/hackrf"]
airspy = ["decdvbt-io/airspy"]
pluto = ["decdvbt-io/pluto"]
rtlsdr = ["decdvbt-io/rtlsdr"]
fobos = ["decdvbt-io/fobos"]
sdrplay = ["decdvbt-io/sdrplay"]
uhd = ["decdvbt-io/uhd"]
remote = ["decdvbt-io/remote"]

[dependencies]
decdvbt-core = { path = "../../crates/decdvbt-core" }
decdvbt-io = { path = "../../crates/decdvbt-io" }
decdvbt-engine = { path = "../../crates/decdvbt-engine" }
decdvbt-mod = { path = "../../crates/decdvbt-mod" }
decdvbt-rx = { path = "../../crates/decdvbt-rx" }
decdvbt-ts = { path = "../../crates/decdvbt-ts" }
anyhow.workspace = true
clap = { version = "4.6", features = ["derive"] }
